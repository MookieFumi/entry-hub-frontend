version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # `typescript` stays on 5.x for the tools that need its JavaScript API (typescript-eslint,
      # openapi-typescript). Type checking uses TypeScript 7 through the `typescript7` alias.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
