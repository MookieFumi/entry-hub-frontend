name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formato
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Los tipos de la API coinciden con el contrato
        run: npm run api:check
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build
      - name: Vulnerabilidades (dependencias de producción)
        run: npm audit --omit=dev --audit-level=high
