name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: API types match the contract
        run: npm run api:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests and accessibility
        run: npm run e2e
      - name: Vulnerabilities (production dependencies)
        run: npm audit --omit=dev --audit-level=high
