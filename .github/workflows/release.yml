name: Release

# Runs when a vX.Y.Z tag is created. Builds the frontend, attaches it to a GitHub release and, if
# enabled, publishes it to Cloudflare Pages.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run api:check
      - run: npm test
      - name: Build
        run: npm run build
        env:
          APP_VERSION: ${{ github.ref_name }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Package
        run: |
          cd dist
          zip -r "../entry-hub-frontend-${GITHUB_REF_NAME}.zip" .
      - name: GitHub release
        # The release may already exist (created from the GitHub UI together with the tag): attach the zip to it
        # when it does, and create it when the tag was pushed on its own.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "entry-hub-frontend-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "entry-hub-frontend-${GITHUB_REF_NAME}.zip" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
      # Optional deployment: enabled by creating the repository variable CLOUDFLARE_DEPLOY=true and the
      # secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Until then only the release is created.
      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "${{ vars.CLOUDFLARE_PROJECT || 'entry-hub-frontend' }}" --branch main
